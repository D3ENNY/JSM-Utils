<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>JSM-utils</title>

    <link rel="stylesheet" href="popup.css">
    <link rel="stylesheet" href="colorpicker.css">
</head>


<body>

<div class="popup">

    <!-- =================================================
         HEADER
         ================================================= -->

    <header class="header">

        <div class="brand">

            <div class="logo">
                J
            </div>

            <div>
                <div class="brand-title">
                    JSM-utils
                </div>

                <div class="brand-subtitle">
                    Personalizza Jira
                </div>
            </div>

        </div>

    </header>


    <!-- =================================================
         FUNZIONALITÀ
         ================================================= -->

    <section class="section">

        <h2 class="section-title">
            Funzionalità
        </h2>


        <div class="card">

            <!-- Colori stati -->

            <div class="feature">

                <div class="feature-info">

                    <span class="feature-name">
                        Colori stati
                    </span>

                    <span class="feature-description">
                        Colora automaticamente gli stati JSM
                    </span>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="enableStatusColors"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Colori team -->

            <div class="feature">

                <div class="feature-info">

                    <span class="feature-name">
                        Colori team
                    </span>

                    <span class="feature-description">
                        Evidenzia le squadre nelle liste
                    </span>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="enableTeamColors"
                    >

                    <span class="slider"></span>

                </label>

            </div>


            <!-- Marker summary -->

            <div class="feature">

                <div class="feature-info">

                    <span class="feature-name">
                        Marker summary
                    </span>

                    <span class="feature-description">
                        Evidenzia [warning], [error] e [success]
                    </span>

                </div>


                <label class="switch">

                    <input
                        type="checkbox"
                        id="enableSummaryMarkers"
                    >

                    <span class="slider"></span>

                </label>

            </div>

        </div>

    </section>



    <!-- =================================================
         COLORI STATI
         ================================================= -->

    <section class="section">

        <details class="collapsible" open>

            <summary>
                <span>Colori stati</span>
            </summary>


            <div
                class="collapsible-content"
                id="statusColors"
            >


                <!-- =====================================
                     ARRIVO
                     ===================================== -->

                <details class="collapsible nested">

                    <summary>
                        <span>Arrivo</span>
                    </summary>


                    <div class="collapsible-content">

                        <!-- popup.js inserirà qui:
                             Nuovo
                             Riassegnato
                             In carico
                             In approvazione
                        -->

                        <div
                            id="status-arrivo"
                            class="color-list"
                        ></div>

                    </div>

                </details>



                <!-- =====================================
                     HD1
                     ===================================== -->

                <details class="collapsible nested">

                    <summary>
                        <span>HD1</span>
                    </summary>


                    <div class="collapsible-content">

                        <!-- popup.js inserirà qui:
                             Sospeso - in attesa terze parti HD1
                             In lavorazione HD1
                             In attesa del cliente HD1
                             In risoluzione HD1
                        -->

                        <div
                            id="status-hd1"
                            class="color-list"
                        ></div>

                    </div>

                </details>



                <!-- =====================================
                     HD2
                     ===================================== -->

                <details class="collapsible nested">

                    <summary>
                        <span>HD2</span>
                    </summary>


                    <div class="collapsible-content">

                        <!-- popup.js inserirà qui:
                             Sospeso - in attesa di terze parti HD2
                             Assegnazione a HD2
                             In lavorazione HD2
                             In attesa del cliente HD2
                             In risoluzione HD2
                        -->

                        <div
                            id="status-hd2"
                            class="color-list"
                        ></div>

                    </div>

                </details>



                <!-- =====================================
                     PIANIFICAZIONE
                     ===================================== -->

                <details class="collapsible nested">

                    <summary>
                        <span>Pianificazione</span>
                    </summary>


                    <div class="collapsible-content">

                        <!-- popup.js inserirà qui:
                             Pianificato
                             Onsite
                        -->

                        <div
                            id="status-pianificazione"
                            class="color-list"
                        ></div>

                    </div>

                </details>



                <!-- =====================================
                     CHIUSI
                     ===================================== -->

                <details class="collapsible nested">

                    <summary>
                        <span>Chiusi</span>
                    </summary>


                    <div class="collapsible-content">

                        <!-- popup.js inserirà qui:
                             Rifiutato
                             Chiuso
                             Risolto onsite
                        -->

                        <div
                            id="status-chiusi"
                            class="color-list"
                        ></div>

                    </div>

                </details>

            </div>

        </details>

    </section>



    <!-- =================================================
         COLORI TEAM
         ================================================= -->

    <section class="section">

        <details class="collapsible" open>

            <summary>
                <span>Colori team</span>
            </summary>


            <div
                class="collapsible-content"
                id="teamColors"
            >

                <!-- popup.js inserirà qui:
                     Sistemistica
                     Programmazione
                     Helpdesk
                -->

                <div
                    id="team-color-list"
                    class="color-list"
                ></div>

            </div>

        </details>

    </section>

    <button
        id="reset"
        class="reset-button"
    >
        ↺ &nbsp; Ripristina impostazioni
    </button>


</div>

<script src="colorpicker.js"></script>
<script src="popup.js"></script>

</body>

</html>
