<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="color-scheme" content="dark">
    <title>JSM-utils</title>

    <link rel="stylesheet" href="styles/index.css">
    <script type="module" src="popup.js"></script>
</head>

<body>

<main class="popup">

    <!-- ================= HEADER ================= -->

    <header class="header">
        <div class="brand">
            <div class="logo" aria-hidden="true">J</div>

            <div>
                <h1 class="brand-title">JSM-utils</h1>
                <p class="brand-subtitle">Personalizza Jira</p>
            </div>
        </div>
    </header>


    <!-- ================= FUNZIONALITÀ ================= -->

    <section class="section" aria-labelledby="features-title">

        <h2 class="section-title" id="features-title">Funzionalità</h2>

        <div class="card">

            <div class="feature">
                <div class="feature-info">
                    <span class="feature-name" id="feature-status-name">Colori stati</span>
                    <span class="feature-description" id="feature-status-desc">
                        Colora automaticamente gli stati JSM
                    </span>
                </div>

                <label class="switch">
                    <input
                        type="checkbox"
                        role="switch"
                        id="enableStatusColors"
                        aria-labelledby="feature-status-name"
                        aria-describedby="feature-status-desc"
                    >
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>

            <div class="feature">
                <div class="feature-info">
                    <span class="feature-name" id="feature-team-name">Colori team</span>
                    <span class="feature-description" id="feature-team-desc">
                        Evidenzia le squadre nelle liste
                    </span>
                </div>

                <label class="switch">
                    <input
                        type="checkbox"
                        role="switch"
                        id="enableTeamColors"
                        aria-labelledby="feature-team-name"
                        aria-describedby="feature-team-desc"
                    >
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>

            <div class="feature">
                <div class="feature-info">
                    <span class="feature-name" id="feature-summary-name">Marker summary</span>
                    <span class="feature-description" id="feature-summary-desc">
                        Evidenzia [warning], [error] e [success]
                    </span>
                </div>

                <label class="switch">
                    <input
                        type="checkbox"
                        role="switch"
                        id="enableSummaryMarkers"
                        aria-labelledby="feature-summary-name"
                        aria-describedby="feature-summary-desc"
                    >
                    <span class="slider" aria-hidden="true"></span>
                </label>
            </div>

        </div>
    </section>


    <!-- ================= COLORI STATI =================
         Le righe vengono generate da popup.js (STATUS_GROUPS). -->

    <section class="section" aria-label="Colori stati">
        <details class="collapsible" open>
            <summary><span>Colori stati</span></summary>

            <div class="collapsible-content">

                <details class="collapsible nested">
                    <summary><span>Arrivo</span></summary>
                    <div class="collapsible-content">
                        <div id="status-arrivo" class="color-list" role="list" aria-label="Stati Arrivo"></div>
                    </div>
                </details>

                <details class="collapsible nested">
                    <summary><span>HD1</span></summary>
                    <div class="collapsible-content">
                        <div id="status-hd1" class="color-list" role="list" aria-label="Stati HD1"></div>
                    </div>
                </details>

                <details class="collapsible nested">
                    <summary><span>HD2</span></summary>
                    <div class="collapsible-content">
                        <div id="status-hd2" class="color-list" role="list" aria-label="Stati HD2"></div>
                    </div>
                </details>

                <details class="collapsible nested">
                    <summary><span>Pianificazione</span></summary>
                    <div class="collapsible-content">
                        <div id="status-pianificazione" class="color-list" role="list" aria-label="Stati Pianificazione"></div>
                    </div>
                </details>

                <details class="collapsible nested">
                    <summary><span>Chiusi</span></summary>
                    <div class="collapsible-content">
                        <div id="status-chiusi" class="color-list" role="list" aria-label="Stati Chiusi"></div>
                    </div>
                </details>

            </div>
        </details>
    </section>


    <!-- ================= COLORI TEAM ================= -->

    <section class="section" aria-label="Colori team">
        <details class="collapsible" open>
            <summary><span>Colori team</span></summary>

            <div class="collapsible-content">
                <div id="team-color-list" class="color-list" role="list" aria-label="Team"></div>
            </div>
        </details>
    </section>


    <button id="reset" type="button" class="reset-button">
        <span class="reset-icon" aria-hidden="true">↺</span>Ripristina impostazioni
    </button>

    <!-- Messaggi di stato per gli screen reader (WCAG 4.1.3) -->
    <p id="status-message" class="visually-hidden" role="status" aria-live="polite"></p>

</main>

</body>

</html>
